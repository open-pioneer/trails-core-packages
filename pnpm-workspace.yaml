packages:
  - src/**
  - "!**/test-data/**"
  - "!**/dist/**"

# https://pnpm.io/catalogs
catalog:
  # Frontend dependencies
  "@chakra-ui/cli": ^3.37.0
  "@chakra-ui/react": ^3.37.0
  "@ark-ui/react": "^5.39.0" # Note: only needed in chakra-snippets, can (maybe) be removed in the future
  "@conterra/reactivity-core": ^0.8.9
  "@conterra/reactivity-events": ^0.8.9
  "@emotion/cache": ^11.14.0
  "@emotion/react": ^11.14.0
  "@formatjs/intl": ^6.1.4
  "@formatjs/intl-localematcher": ^0.9.0
  keycloak-js: ^26.2.4
  react-dom: ^19.3.1
  react-icons: ^5.7.0
  react: ^19.3.1

  # Samples only
  react-json-view: ^1.21.3
  shiki: ^4.5.0

  # Devtools
  "@changesets/cli": ^2.31.1
  "@open-pioneer/build-package-cli": ^4.0.2
  "@open-pioneer/build-support": ^4.0.2
  "@open-pioneer/changesets-release-line": ^0.2.2
  "@open-pioneer/check-pnpm-duplicates": ^0.5.0
  "@open-pioneer/vite-plugin-pioneer": ^7.1.1
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": "^6.1.2"
  "@vitest/browser-playwright": ^5.0.5
  "@vitest/browser-preview": ^5.0.5
  "@tony.ganchev/eslint-plugin-header": ^3.4.4
  fast-equals: ^6.2.1
  fast-glob: ^3.3.3
  happy-dom: ^21.0.4
  husky: ^9.1.7
  lint-staged: ^17.6.0
  oxlint: ^1.89.0
  playwright: ^1.64.1
  oxfmt: ^0.75.0
  resize-observer-polyfill: ^1.5.1
  rimraf: ^6.1.3
  sass: ^1.106.1
  tsx: ^4.23.15
  typedoc: ^0.28.20
  typescript: ^6.0.3
  vitest-browser-react: ^2.3.0
  vite: ^8.3.5
  vitest: ^5.0.5
  zx: ^8.8.5

overrides:
  # We don't actually use the babel plugin.
  # The babel runtime is also not used as a production dependency.
  # See e.g. https://github.com/emotion-js/emotion/issues/2371
  "@emotion/react>@babel/runtime": "-"
  "@emotion/react>@emotion/babel-plugin": "-"
  "@emotion/styled>@babel/runtime": "-"
  "@emotion/styled>@emotion/babel-plugin": "-"

  # Ensure patched packages have the expected version (patch was tested with this version):
  "@chakra-ui/react": "3.37.0"
  "@ark-ui/react": "5.39.0"
  "@zag-js/interact-outside": "1.43.3"

  # https://github.com/advisories/GHSA-xjj6-f33q-929c
  "undici@>=7.0.0 <7.30.1": "^7.30.1"

  # https://github.com/advisories/GHSA-mrhx-c7xc-m3w5
  "zod@>=4.0.0 <4.6.6": "^4.6.6"

allowUnusedPatches: true
patchedDependencies:
  # Currently needed to disable optimization of @open-pioneer/runtime during dev mode.
  # This is ONLY needed in the core packages repository because we're developing the runtime package here.
  # NOTE: This could be an (internal) option in the vite plugin instead.
  "@open-pioneer/vite-plugin-pioneer": patches/@open-pioneer__vite-plugin-pioneer.patch

  # Ensure all portals are mounted under `.pioneer-root` div
  "@ark-ui/react": patches/@ark-ui__react.patch

  # Fixes 'interact-outside' logic not working when tabbing between elements within the same shadow dom.
  # Can be removed if https://github.com/chakra-ui/zag/issues/3088 is fixed.
  # This can be tested by opening the chakra ui showcase (tab "overlays"), opening the "Popover (Without Portal)" using keyboard controls,
  # and pressing tab to leave the popover again. The popover should close.
  "@zag-js/interact-outside": patches/@zag-js__interact-outside.patch

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # No release available for recent react, but they appear to work well enough for sample apps.
    "flux>react": ">=19"
    "react-json-view>react": ">=19"
    "react-json-view>react-dom": ">=19"

    # See overrides
    "rollup": "*"
    "fdir>picomatch": "*"
    "tsconfck>typescript": "*"

audit:
  level: "moderate"

auditConfig:
  ignoreGhsas:
    # https://github.com/advisories/GHSA-mrhx-c7xc-m3w5, CVE-2023-54404
    # currently cannot update version 3.x; used by chakra's CLI
    - GHSA-mrhx-c7xc-m3w5

permissions:
  "@parcel/watcher":
    build: true
  "@swc/core":
    build: true
  esbuild:
    build: true
  "@conterra/reactivity-core":
    skills: true

  # Seems to work without build scripts; may revisit later if actually needed.
  core-js:
    build: false
  unrs-resolver:
    build: false

# Install older versions by default
resolutionMode: "lowest-direct"

# Configure a release cooldown
minimumReleaseAge: 4320 # 3 days in minutes
minimumReleaseAgeExclude:
  - "@open-pioneer/*"
  - "@conterra/*"

trustPolicy: no-downgrade
trustPolicyExclude:
  - "undici-types@6.21.0"
  - "semver@6.3.1"
  - "ua-parser-js@1.0.41"

# Workspace root itself depends on runtime, and all packages (including runtime) have a dev dependency on workspace root
# for shared scripts.
ignoreWorkspaceCycles: true

# Don't like unless `workspace:` is used as protocol.
linkWorkspacePackages: false

# Workaround for current problems regarding our vite plugin + vite's optimizeDeps feature
shamefullyHoist: true
