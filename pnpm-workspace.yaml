packages:
  - src/**
  - "!**/test-data/**"
  - "!**/dist/**"

# https://pnpm.io/catalogs
catalog:
  # Frontend dependencies
  "@chakra-ui/cli": ^3.36.1
  "@chakra-ui/react": ^3.36.1
  "@ark-ui/react": "^5.37.2" # Note: only needed in chakra-snippets, can (maybe) be removed in the future
  "@conterra/reactivity-core": ^0.8.6
  "@conterra/reactivity-events": ^0.8.6
  "@emotion/cache": ^11.14.0
  "@emotion/react": ^11.14.0
  "@formatjs/intl": ^4.1.17
  "@formatjs/intl-localematcher": ^0.8.13
  keycloak-js: ^26.2.4
  react-dom: ^19.2.8
  react-icons: ^5.7.0
  react-use: ^17.6.1
  react: ^19.2.8

  # Samples only
  react-json-view: ^1.21.3
  shiki: ^4.3.1

  # Devtools
  "@changesets/cli": ^2.31.1
  "@open-pioneer/build-package-cli": ^3.2.2
  "@open-pioneer/build-support": ^3.1.3
  "@open-pioneer/changesets-release-line": ^0.1.3
  "@open-pioneer/check-pnpm-duplicates": ^0.3.5
  "@open-pioneer/vite-plugin-pioneer": ^6.0.3
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.1
  "@types/node": ^20.19.43
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": "^6.0.4"
  "@tony.ganchev/eslint-plugin-header": ^3.4.4
  fast-equals: ^6.0.2
  fast-glob: ^3.3.3
  happy-dom: ^20.11.1
  husky: ^9.1.7
  lint-staged: ^17.2.0
  oxlint: ^1.75.0
  js-yaml: ^4.1.1
  oxfmt: ^0.60.0
  rimraf: ^6.1.3
  sass: ^1.101.7
  tsx: ^4.23.1
  typedoc: ^0.28.20
  typescript: ^6.0.3
  vite: ^8.1.5
  vitest: ^4.1.10
  zx: ^8.8.5

overrides:
  # We don't actually use the babel plugin.
  # The babel runtime is also not used as a production dependency.
  # See e.g. https://github.com/emotion-js/emotion/issues/2371
  "@emotion/react>@babel/runtime": "-"
  "@emotion/react>@emotion/babel-plugin": "-"
  "@emotion/styled>@babel/runtime": "-"
  "@emotion/styled>@emotion/babel-plugin": "-"

  # Just to get rid of some duplicate dependencies
  "stylis@<4.3.5": ">= 4.3.5"

  # Ensure patched packages have the expected version (patch was tested with this version):
  "@chakra-ui/react": "3.36.1"
  "@ark-ui/react": "5.37.2"
  "@zag-js/interact-outside": "1.41.2"

  # https://github.com/advisories/GHSA-g7r4-m6w7-qqqr
  # https://github.com/advisories/GHSA-gv7w-rqvm-qjhr
  "esbuild@<=0.28.0": "^0.28.1"

  # https://github.com/advisories/GHSA-52cp-r559-cp3m, CVE-2026-59869
  "js-yaml@>=3.0.0 <3.15.0": "^3.15.0"

  # https://github.com/advisories/GHSA-3jxr-9vmj-r5cp, CVE-2026-13149
  # https://github.com/advisories/GHSA-mh99-v99m-4gvg, CVE-2026-14257
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=3.0.0 <5.0.8": "^5.0.8"

  # https://github.com/advisories/GHSA-xvcm-6775-5m9r, CVE-2026-59880
  "immutable@>=5.0.0 <5.1.8": "^5.1.8"

allowUnusedPatches: true
patchedDependencies:
  # Currently needed to disable optimization of @open-pioneer/runtime during dev mode.
  # This is ONLY needed in the core packages repository because we're developing the runtime package here.
  # NOTE: This could be an (internal) option in the vite plugin instead.
  "@open-pioneer/vite-plugin-pioneer": patches/@open-pioneer__vite-plugin-pioneer.patch

  # Ensure all portals are mounted under `.pioneer-root` div
  "@ark-ui/react@*": "patches/@ark-ui__react.patch"

  # Fixes 'interact-outside' logic not tabbing between elements within the same shadow dom.
  # Can be removed if https://github.com/chakra-ui/zag/issues/3088 is fixed.
  "@zag-js/interact-outside": patches/@zag-js__interact-outside.patch

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # No release available for recent react, but they appear to work well enough for sample apps.
    "flux>react": ">=19"
    "react-json-view>react": ">=19"
    "react-json-view>react-dom": ">=19"

    # See overrides
    "rollup": "*"
    "fdir>picomatch": "*"
    "tsconfck>typescript": "*"

auditConfig:
  ignoreGhsas:
    # https://github.com/advisories/GHSA-h67p-54hq-rp68, CVE-2026-53550
    - GHSA-h67p-54hq-rp68

    # https://github.com/advisories/GHSA-mh99-v99m-4gvg, CVE-2026-14257
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  # Seems to work without build scripts; may revisit later if actually needed.
  core-js: false
  unrs-resolver: false

# Install older versions by default
resolutionMode: "lowest-direct"

# Configure a release cooldown
minimumReleaseAge: 4320 # 3 days in minutes
minimumReleaseAgeExclude:
  - "@open-pioneer/*"
  - "@conterra/*"

trustPolicy: no-downgrade
trustPolicyExclude:
  - "undici-types@6.21.0"
  - "semver@6.3.1"
  - "chokidar@4.0.3"
  - "rollup@2.80.0"
  - "ua-parser-js@1.0.41"

# Workspace root itself depends on runtime, and all packages (including runtime) have a dev dependency on workspace root
# for shared scripts.
ignoreWorkspaceCycles: true

# Don't like unless `workspace:` is used as protocol.
linkWorkspacePackages: false

# Workaround for current problems regarding our vite plugin + vite's optimizeDeps feature
shamefullyHoist: true
